<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Tip calculator app</title>


</head>
<body>
  <div class="container">
    <div class="input-section">
      <label for="bill">Bill</label>
      <input type="number" oninput ="onBillChange(event)" id="bill" placeholder="0.00">

      <label>Select Tip %</label>
      <div class="tip-buttons">
        <button value = 5>5%</button>
        <button value = 10>10%</button>
        <button value = 15>15%</button>
        <button value = 25>25%</button>
        <button value = 50>50%</button>
        <input type="number" placeholder="Custom" id="tip-perentage-input" onclick="ontipPercentageChange(event)" class="custom-tip">
      </div>

      <label for="people" >Number of People</label>
      <input type="number" id="people" oninput="onpeopleChange(event)" placeholder="0">
      
    </div>

    <div class="output-section">
      <div class="output" id="tip-person">
        <p>Tip Amount / person</p>
        <p id="tip-person-value">$0.00</p> 
      </div>
      <div class="output" id="total-person">
        <p>Total / person</p>
        <p id="total-person-value">$0.00</p> 
      </div>
      <button class="reset" >RESET</button> 
    </div>
    
  </div>
</body>
<script src="script.js"></script>
</html>
